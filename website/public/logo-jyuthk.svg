<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@800&amp;display=swap');
      .logo-title {
        font-family: 'Cinzel', 'Playfair Display', 'Bodoni 72', 'Didot', 'Baskerville', 'Times New Roman', serif;
        font-weight: 800;
        letter-spacing: 2px;
      }
    </style>
    <g id="hk-petal">
      <path d="M 492.936022 125.19583 a 27.917245 27.917245 0 0 0 -14.901582 41.791893 a 45.171052 45.171052 0 0 1 -20.289932 66.204239 a 38.650583 38.650583 0 0 0 -10.816469 64.313021 A 90.342104 90.342104 0 0 1 492.936022 125.19583 Z" />
    </g>
    <g id="hk-flower">
      <use href="#hk-petal" transform="rotate(0 450 300)"/>
      <use href="#hk-petal" transform="rotate(72 450 300)"/>
      <use href="#hk-petal" transform="rotate(144 450 300)"/>
      <use href="#hk-petal" transform="rotate(216 450 300)"/>
      <use href="#hk-petal" transform="rotate(288 450 300)"/>
    </g>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="108" fill="#1b1b1d" />

  <!-- Hong Kong Bauhinia Flower in High-Contrast Crimson -->
  <g transform="translate(256, 175) scale(0.98) translate(-450, -300)">
    <use href="#hk-flower" fill="none" stroke="#EA283B" stroke-width="15" stroke-linejoin="round" stroke-linecap="round" />
  </g>

  <!-- Giant High-Legibility JYUT.HK for Small-Screen/Favicon/Navbar Visibility -->
  <text
    x="256"
    y="415"
    text-anchor="middle"
    class="logo-title"
    font-size="124"
  >
    <tspan fill="#FFFFFF">JYUT</tspan><tspan fill="#F59E0B">.HK</tspan>
  </text>
</svg>
