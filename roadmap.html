<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>粵語學習導航 - 粵語懸浮詞典</title>
    <script src="theme-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="icon_favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #8A1C1C;
        --primary-light: #B42929;
        --primary-dark: #382424;
        --accent: #22c55e;
        --bg-page: #f8fafc;
        --bg-card: #ffffff;
        --bg-input: #f1f5f9;
        --bg-hover: #e2e8f0;
        --text-primary: #1e293b;
        --text-secondary: #64748b;
        --text-muted: #94a3b8;
        --border: #e2e8f0;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        --shadow-lg: 0 10px 25px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        --radius: 12px;
        --transition: 200ms ease;
      }

      :root[data-theme="dark"] {
        --primary: #e05353;
        --primary-light: #f87171;
        --primary-dark: #b91c1c;
        --accent: #34d399;
        --bg-page: #121214;
        --bg-card: #1c1b1e;
        --bg-input: #262529;
        --bg-hover: #2a292e;
        --text-primary: #f3f2f5;
        --text-secondary: #b5b2ba;
        --text-muted: #7a7780;
        --border: #333138;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.4), 0 2px 4px rgba(0, 0, 0, 0.3);
        --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.5), 0 4px 6px rgba(0, 0, 0, 0.4);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: var(--bg-page);
        color: var(--text-primary);
        line-height: 1.6;
        min-height: 100vh;
        padding: 24px 20px 60px;
        transition: background-color var(--transition), color var(--transition);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      /* ========== Top Navigation Bar ========== */
      .top-navbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
        flex-wrap: wrap;
        gap: 12px;
      }

      .nav-links-group {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .nav-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-secondary);
        transition: all var(--transition);
        text-decoration: none;
      }

      .nav-btn:hover {
        border-color: var(--primary);
        color: var(--primary);
        transform: translateY(-1px);
        box-shadow: var(--shadow);
      }

      .theme-toggle {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text-muted);
        transition: all var(--transition);
      }

      .theme-toggle:hover {
        color: var(--primary);
        border-color: var(--primary);
      }

      /* ========== Hero Header ========== */
      .hero-header {
        text-align: center;
        margin-bottom: 36px;
      }

      .hero-title {
        font-size: 32px;
        font-weight: 700;
        color: var(--primary);
        letter-spacing: -0.5px;
        margin-bottom: 8px;
      }

      .hero-subtitle {
        font-size: 15px;
        color: var(--text-secondary);
        max-width: 680px;
        margin: 0 auto 24px;
      }

      /* Search Container */
      .search-container {
        max-width: 540px;
        margin: 0 auto;
        position: relative;
      }

      .search-input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      .search-icon {
        position: absolute;
        left: 14px;
        color: var(--text-muted);
        pointer-events: none;
      }

      .search-input {
        width: 100%;
        padding: 12px 42px 12px 42px;
        border-radius: 30px;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-primary);
        font-size: 14px;
        font-family: inherit;
        outline: none;
        box-shadow: var(--shadow);
        transition: all var(--transition);
      }

      .search-input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(138, 28, 28, 0.12), var(--shadow);
      }

      :root[data-theme="dark"] .search-input:focus {
        box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2), var(--shadow);
      }

      .search-clear-btn {
        position: absolute;
        right: 12px;
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 4px;
        border-radius: 50%;
        display: none;
        align-items: center;
        justify-content: center;
      }

      .search-clear-btn:hover {
        color: var(--text-primary);
      }

      /* ========== Category Filter Bar ========== */
      .filter-bar-wrapper {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 24px;
      }

      .filter-pills {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .filter-pill {
        padding: 7px 16px;
        font-size: 13px;
        font-weight: 500;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-secondary);
        cursor: pointer;
        transition: all var(--transition);
        font-family: inherit;
      }

      .filter-pill:hover {
        border-color: var(--primary);
        color: var(--primary);
      }

      .filter-pill.active {
        background: var(--primary);
        color: #ffffff;
        border-color: var(--primary);
        box-shadow: 0 2px 8px rgba(138, 28, 28, 0.25);
      }

      :root[data-theme="dark"] .filter-pill.active {
        box-shadow: 0 2px 8px rgba(239, 68, 68, 0.35);
      }

      .resources-count {
        font-size: 13px;
        color: var(--text-muted);
        font-weight: 500;
      }

      /* ========== Resources Bento Grid ========== */
      .resources-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 18px;
      }

      .resource-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        display: flex;
        flex-direction: column;
        text-decoration: none;
        color: inherit;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
        box-shadow: var(--shadow);
      }

      .resource-card:hover {
        transform: translateY(-3px);
        border-color: var(--primary);
        box-shadow: var(--shadow-lg);
      }

      :root[data-theme="dark"] .resource-card:hover {
        border-color: var(--primary-light);
      }

      .card-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .card-icon-title {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .card-icon-box {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: var(--bg-input);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        overflow: hidden;
      }

      .card-icon-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .card-title {
        font-size: 16px;
        font-weight: 700;
        color: var(--text-primary);
        line-height: 1.3;
      }

      .card-badge {
        font-size: 11px;
        font-weight: 600;
        padding: 3px 8px;
        border-radius: 6px;
        letter-spacing: 0.3px;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .badge-phonetics { background: rgba(59, 130, 246, 0.12); color: #2563eb; border: 1px solid rgba(59, 130, 246, 0.25); }
      .badge-dictionary { background: rgba(184, 134, 11, 0.12); color: #b8860b; border: 1px solid rgba(184, 134, 11, 0.25); }
      .badge-tool { background: rgba(16, 185, 129, 0.12); color: #059669; border: 1px solid rgba(16, 185, 129, 0.25); }
      .badge-input { background: rgba(139, 92, 246, 0.12); color: #7c3aed; border: 1px solid rgba(139, 92, 246, 0.25); }
      .badge-reading { background: rgba(236, 72, 153, 0.12); color: #db2777; border: 1px solid rgba(236, 72, 153, 0.25); }
      .badge-media { background: rgba(245, 158, 11, 0.12); color: #d97706; border: 1px solid rgba(245, 158, 11, 0.25); }

      :root[data-theme="dark"] .badge-phonetics { color: #60a5fa; border-color: rgba(96, 165, 250, 0.3); }
      :root[data-theme="dark"] .badge-dictionary { color: #e8b84e; border-color: rgba(232, 184, 78, 0.3); }
      :root[data-theme="dark"] .badge-tool { color: #34d399; border-color: rgba(52, 211, 153, 0.3); }
      :root[data-theme="dark"] .badge-input { color: #a78bfa; border-color: rgba(167, 139, 250, 0.3); }
      :root[data-theme="dark"] .badge-reading { color: #f472b6; border-color: rgba(244, 114, 182, 0.3); }
      :root[data-theme="dark"] .badge-media { color: #fbbf24; border-color: rgba(251, 191, 36, 0.3); }

      .card-desc {
        font-size: 13px;
        line-height: 1.55;
        color: var(--text-secondary);
        margin-bottom: 16px;
        flex: 1;
      }

      .card-footer {
        display: flex;
        align-items: center;
        padding-top: 12px;
        border-top: 1px solid var(--border);
        font-size: 12px;
      }

      .card-domain {
        color: var(--text-muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      /* ========== Empty State ========== */
      .empty-state {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 60px 20px;
        text-align: center;
        background: var(--bg-card);
        border: 1px dashed var(--border);
        border-radius: var(--radius);
        grid-column: 1 / -1;
      }

      .empty-state-icon {
        margin-bottom: 12px;
        color: var(--text-muted);
      }

      .empty-state-title {
        font-size: 16px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 4px;
      }

      .empty-state-desc {
        font-size: 13px;
        color: var(--text-muted);
      }
      /* ========== Modal Dialog Styles ========== */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 20px;
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .modal-overlay.show {
        display: flex;
        opacity: 1;
      }

      .modal-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        max-width: 500px;
        width: 100%;
        box-shadow: var(--shadow-lg);
        overflow: hidden;
        transform: scale(0.95) translateY(10px);
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        display: flex;
        flex-direction: column;
      }

      .modal-overlay.show .modal-card {
        transform: scale(1) translateY(0);
      }

      .modal-header {
        padding: 20px 24px 16px;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--border);
      }

      .modal-header-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .modal-icon-badge {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: color-mix(in srgb, var(--primary) 12%, transparent);
        color: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .modal-title {
        font-size: 17px;
        font-weight: 700;
        color: var(--text-primary);
        line-height: 1.3;
        margin-bottom: 3px;
      }

      .modal-subtitle {
        font-size: 12px;
        color: var(--text-secondary);
        line-height: 1.4;
      }

      .modal-close-btn {
        background: none;
        border: none;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all var(--transition);
        flex-shrink: 0;
      }

      .modal-close-btn:hover {
        background: var(--bg-hover);
        color: var(--text-primary);
      }

      .modal-body {
        padding: 20px 24px;
        overflow-y: auto;
        max-height: calc(85vh - 140px);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .form-label-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .form-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary);
      }

      .badge-req {
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 4px;
        background: color-mix(in srgb, var(--primary) 12%, transparent);
        color: var(--primary);
        font-weight: 500;
      }

      .badge-opt {
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 4px;
        background: var(--bg-input);
        color: var(--text-muted);
        font-weight: 500;
      }

      .form-input, .form-select, .form-textarea {
        width: 100%;
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg-input);
        color: var(--text-primary);
        font-family: inherit;
        font-size: 13.5px;
        outline: none;
        transition: all var(--transition);
        box-sizing: border-box;
      }

      .form-input:focus, .form-select:focus, .form-textarea:focus {
        border-color: var(--primary);
        background: var(--bg-card);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 15%, transparent);
      }

      .form-textarea {
        resize: vertical;
        min-height: 68px;
      }

      .modal-footer {
        padding: 14px 24px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        background: color-mix(in srgb, var(--bg-input) 30%, var(--bg-card));
      }

      .btn-cancel {
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-secondary);
        transition: all var(--transition);
      }

      .btn-cancel:hover {
        background: var(--bg-hover);
        color: var(--text-primary);
      }

      .btn-submit {
        padding: 8px 18px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        background: var(--primary);
        color: #ffffff;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all var(--transition);
        box-shadow: 0 2px 6px color-mix(in srgb, var(--primary) 30%, transparent);
      }

      .btn-submit:hover:not(:disabled) {
        background: var(--primary-light);
        transform: translateY(-1px);
        box-shadow: 0 4px 10px color-mix(in srgb, var(--primary) 40%, transparent);
      }

      .btn-submit:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      .rec-success-box {
        text-align: center;
        padding: 32px 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .rec-success-icon {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: color-mix(in srgb, #22c55e 15%, transparent);
        color: #22c55e;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: recScaleIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      @keyframes recScaleIn {
        0% { transform: scale(0.4); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }

      /* Responsive */
      @media (max-width: 768px) {
        body { padding: 16px 12px 40px; }
        .hero-title { font-size: 26px; }
        .resources-grid { grid-template-columns: 1fr; }
        .timeline-steps { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="container">

      <!-- Top Navigation Bar -->
      <nav class="top-navbar">
        <div class="nav-links-group">
          <a href="options.html" class="nav-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span data-i18n="wordbookBackToSettings">返回設定</span>
          </a>
        </div>

        <div style="display: flex; align-items: center; gap: 10px;">
          <button class="nav-btn recommend-nav-btn" id="openRecommendModalBtn" style="background: color-mix(in srgb, var(--primary) 8%, var(--bg-card)); color: var(--primary); border-color: color-mix(in srgb, var(--primary) 28%, var(--border));">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14M5 12h14"></path>
            </svg>
            <span data-i18n="optRoadmapRecommendBtn">推薦優質資源</span>
          </button>

          <button class="theme-toggle" id="themeToggle" title="切換主題">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </button>
        </div>
      </nav>

      <!-- Hero Header -->
      <header class="hero-header">
        <h1 class="hero-title" data-i18n="optRoadmapSectionTitle">粵語學習導航</h1>
        <p class="hero-subtitle" data-i18n="optRoadmapSectionDesc">精選權威拼音教程、查詞辭書、輸入法與聽力語料，助你系統掌握地道粵語</p>

        <!-- Search Bar -->
        <div class="search-container">
          <div class="search-input-wrapper">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchInput" class="search-input" data-i18n="optRoadmapSearchPlaceholder" placeholder="搜尋資源名稱、關鍵字、網站域名..." />
            <button id="searchClearBtn" class="search-clear-btn" title="清除">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
        </div>
      </header>

      <!-- Category Filter & Count Bar -->
      <div class="filter-bar-wrapper">
        <div class="filter-pills" id="filterPills">
          <button class="filter-pill active" data-filter="all" data-i18n="optRoadmapFilterAll">全部</button>
          <button class="filter-pill" data-filter="phonetics" data-i18n="optRoadmapFilterPhonetics">拼音入門</button>
          <button class="filter-pill" data-filter="dictionary" data-i18n="optRoadmapFilterDict">權威辭書</button>
          <button class="filter-pill" data-filter="tool" data-i18n="optRoadmapFilterTool">實用工具</button>
          <button class="filter-pill" data-filter="input" data-i18n="optRoadmapFilterInput">粵拼輸入</button>
          <button class="filter-pill" data-filter="reading" data-i18n="optRoadmapFilterReading">聽讀進階</button>
          <button class="filter-pill" data-filter="media" data-i18n="optRoadmapFilterMedia">影視文化</button>
        </div>
        <div class="resources-count" id="resourcesCount">共 42 個精選資源</div>
      </div>

      <!-- Bento Grid of Resources -->
      <main class="resources-grid" id="resourcesGrid">
        <!-- Dynamically rendered by roadmap.js -->

        <!-- Empty State (hidden by default) -->
        <div class="empty-state" id="emptyState" style="display: none;">
          <div class="empty-state-icon">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </div>
          <div class="empty-state-title" data-i18n="optRoadmapEmptyTitle">未找到匹配的學習資源</div>
          <div class="empty-state-desc" data-i18n="optRoadmapEmptyDesc">請嘗試使用其他關鍵字或切換分類篩選標籤</div>
        </div>

      </main>

    </div>

    <!-- Recommend Learning Resource Modal -->
    <div class="modal-overlay" id="recommendModal" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="recommendModalTitle">
        
        <div class="modal-header">
          <div class="modal-header-left">
            <div class="modal-icon-badge">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v1"></path>
                <path d="M12 21v1"></path>
                <path d="M4.22 4.22l.71.71"></path>
                <path d="M19.07 19.07l.71.71"></path>
                <path d="M2 12h1"></path>
                <path d="M21 12h1"></path>
                <path d="M4.22 19.78l.71-.71"></path>
                <path d="M19.07 4.93l.71-.71"></path>
                <circle cx="12" cy="12" r="6"></circle>
              </svg>
            </div>
            <div>
              <h3 class="modal-title" id="recommendModalTitle" data-i18n="optRoadmapRecommendModalTitle">推薦粵語學習資源</h3>
              <p class="modal-subtitle" data-i18n="optRoadmapRecommendModalDesc">分享你發現的優質網站或工具，我們審核後將收錄進導航庫！</p>
            </div>
          </div>
          <button class="modal-close-btn" id="closeRecommendModalBtn" title="關閉" aria-label="關閉">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <form id="recommendForm">
          <div class="modal-body" id="recommendFormBody">
            <textarea
              id="recContentInput"
              class="form-textarea"
              required
              style="min-height: 140px; font-size: 14px; line-height: 1.6; padding: 14px; border-radius: 10px;"
              placeholder="請在此貼上網站網址（如 https://example.com）~&#10;若有想補充的網站名稱或推薦理由也可以寫在這裡："
              data-i18n-placeholder="optRoadmapRecSinglePlaceholder"
            ></textarea>
          </div>

          <div class="modal-footer" id="recommendFormFooter">
            <button type="button" class="btn-cancel" id="cancelRecommendBtn" data-i18n="optCancel">取消</button>
            <button type="submit" class="btn-submit" id="submitRecommendBtn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
              <span id="submitBtnText" data-i18n="optRoadmapRecSubmitBtn">發送推薦</span>
            </button>
          </div>
        </form>

      </div>
    </div>

    <script src="roadmap-data.js"></script>
    <script src="roadmap.js"></script>
  </body>
</html>
