name: Upload Chrome Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack extension into ZIP
        run: |
          zip -r extension.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "node_modules/*" \
            -x "data/*" \
            -x "wordshk-tools/*" \
            -x "server_deploy/*" \
            -x "scripts/*" \
            -x "docs/*" \
            -x ".DS_Store" \
            -x "*.zip" \
            -x "*.bak" \
            -x "*.log" \
            -x "test.js" \
            -x "test.html" \
            -x "temp.html" \
            -x "render_svg.mjs" \
            -x ".gitignore" \
            -x "README.md" \
            -x "README_EN.md" \
            -x "QUICKSTART.md"

      - name: Upload to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v6.0.0
        with:
          file-path: 'extension.zip'
          extension-id: ${{ secrets.EXTENSION_ID }}
          client-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          refresh-token: ${{ secrets.REFRESH_TOKEN }}
          publish: true
